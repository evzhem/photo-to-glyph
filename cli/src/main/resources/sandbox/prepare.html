<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PhotoGlyph · M2</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/prepare.css"><script src="/prepare.js" defer></script></head>
<body><header class="topbar"><a href="/" data-i18n="app_name"></a><div class="topbar-actions"><a href="/" data-i18n="prep_back_lab"></a><select id="language"><option value="ru">RU</option><option value="en">EN</option></select></div></header>
<main class="prep-main"><div class="eyebrow" data-i18n="prep_badge"></div><h1 data-i18n="prep_headline"></h1><p class="prep-intro" data-i18n="prep_intro"></p>
<section class="prep-actions"><button id="sample" class="primary-button" data-i18n="prep_sample"></button><a class="secondary-button" href="/api/grid-sheet" download="photoglyph-a4-grid.svg" data-i18n="prep_grid_download"></a><span id="source-kind" data-i18n="synthetic_notice"></span></section>
<div id="notice" class="notice" hidden></div>
<div class="prep-workbench"><article class="preview-card"><div class="preview-heading"><h3 data-i18n="prep_source_title"></h3><span id="dimensions"></span></div><div class="prep-canvas"><canvas id="source-canvas" width="720" height="840"></canvas></div><p class="prep-hint" data-i18n="prep_drag_hint"></p><div class="prep-toolbar"><button id="detect" class="secondary-button" data-i18n="prep_detect"></button><button id="rotate" class="secondary-button" data-i18n="prep_rotate"></button><button id="crop" class="secondary-button" data-i18n="prep_crop"></button></div></article>
<article class="preview-card"><div class="preview-heading"><h3 data-i18n="prep_result_title"></h3><span id="output-dimensions"></span></div><div class="paper prep-output"><img id="output" data-i18n-alt="prep_result_title" hidden><span id="empty" data-i18n="prep_empty"></span></div><div class="prep-result-actions"><button id="show-binary" class="secondary-button" data-i18n="view_binary" disabled></button><button id="show-rectified" class="secondary-button" data-i18n="prep_rectified" disabled></button><button id="download" class="secondary-button" data-i18n="prep_download" disabled></button></div><p class="prep-hint" id="result-info"></p></article>
<aside class="parameter-card"><h2 data-i18n="prep_params_title"></h2><form id="form"><label class="control"><span data-i18n="window_label"></span><select id="window"><option value="15">15 × 15</option><option value="25" selected>25 × 25</option><option value="35">35 × 35</option><option value="51">51 × 51</option></select></label><label class="control"><span class="control-line"><span data-i18n="offset_label"></span><output id="offset-value">10</output></span><input type="range" id="offset" min="0" max="50" value="10" step="1"></label><label class="consent"><input type="checkbox" id="a4" checked><span data-i18n="prep_a4"></span></label><p class="prep-hint" data-i18n="prep_ratio_note"></p><button class="primary-button" id="process" type="submit" data-i18n="prep_process"></button></form><p class="prep-hint" data-i18n="prep_no_recognition"></p></aside></div>
<section class="upload-card"><h2 data-i18n="prep_upload"></h2><p class="privacy-note" data-i18n="privacy_notice"></p><label class="consent"><input type="checkbox" id="consent"><span data-i18n="consent"></span></label><div class="upload-actions"><button id="choose-file" class="secondary-button" data-i18n="choose_file" disabled></button><button id="clear-file" class="text-button" data-i18n="clear_upload" hidden></button><span id="filename"></span></div><input id="file" type="file" accept="image/png,image/jpeg" hidden></section>
<section class="development-notes"><article><h2 data-i18n="prep_outlines_title"></h2><p data-i18n="prep_outlines_plan"></p></article><article class="known-issue"><h2 data-i18n="prep_detection_title"></h2><p data-i18n="prep_detection_note"></p></article></section><footer><span data-i18n="app_name"></span><p data-i18n="prep_limits"></p></footer></main></body></html>
